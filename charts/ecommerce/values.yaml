nameOverride: ""
fullnameOverride: ""

global:
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""
  topologySpread:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  topologySpreadConstraints: []
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    privileged: false
    procMount: Default
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  tmp:
    sizeLimit: 64Mi
  env:
    NODE_ENV: production
    REQUEST_TIMEOUT_MS: "30000"
    POSTGRES_POOL_MAX: "20"
    POSTGRES_IDLE_TIMEOUT_MS: "30000"
    POSTGRES_CONNECTION_TIMEOUT_MS: "5000"
    KAFKA_BROKERS: kafka:9092
    KAFKA_LOG_LEVEL: error
    KAFKA_CONNECTION_TIMEOUT_MS: "3000"
    KAFKA_REQUEST_TIMEOUT_MS: "25000"
    KAFKA_TOPIC_NUM_PARTITIONS: "3"
    KAFKA_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "2"
    KAFKA_UI_URL: https://kafka.example.com
    CORS_ALLOWED_ORIGINS: https://shop.example.com,https://admin.example.com
    CLERK_AUTHORIZED_PARTIES: https://shop.example.com,https://admin.example.com
    TELEMETRY_ENABLED: "true"
    TELEMETRY_LOG_FORMAT: json
    PROMETHEUS_METRICS_ENABLED: "true"
    PROMETHEUS_METRICS_PATH: /metrics

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

stripeCli:
  enabled: false
  image:
    repository: stripe/stripe-cli
    tag: v1.50.6
    digest: sha256:40145a651e181b564c8442e1218f8fde4cf6aefe23f01bd2e450b9ee2e8c1b25
    pullPolicy: IfNotPresent
  forwardTo: http://127.0.0.1:8002/api/webhooks/stripe
  webhookSecretFile: /var/run/stripe/webhook-secret
  events: checkout.session.completed,checkout.session.async_payment_succeeded
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

secrets:
  create: false
  name: ""
  stringData:
    DATABASE_URL: ""
    MONGO_URL: ""
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    CLERK_PUBLISHABLE_KEY: ""
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    CLERK_SECRET_KEY: ""
    CLERK_JWT_KEY: ""
    ADMIN_USER_IDS: ""

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  tls:
    enabled: true
    secretName: ecommerce-local-tls
  hosts:
    - host: shop.localhost
      paths:
        - path: /
          pathType: Prefix
          service: client
          port: http
    - host: admin.localhost
      paths:
        - path: /
          pathType: Prefix
          service: admin
          port: http
    - host: api.localhost
      paths:
        - path: /rpc/product
          pathType: Prefix
          service: product
          port: http
        - path: /rpc/order
          pathType: Prefix
          service: order
          port: http
        - path: /rpc/payment
          pathType: Prefix
          service: payment
          port: http
        - path: /api/webhooks
          pathType: Prefix
          service: payment
          port: http

gateway:
  enabled: false
  create: false
  name: traefik-gateway
  namespace: traefik
  gatewayClassName: traefik
  sectionName: websecure
  annotations: {}
  labels: {}
  listeners:
    - name: websecure
      hostname: "*.localhost"
      port: 8443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ecommerce-local-tls

observability:
  serviceMonitor:
    enabled: false
    labels:
      release: kube-prometheus-stack
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    jobLabel: app.kubernetes.io/component
    services:
      - product
      - order
      - payment
    metricRelabelings: []
    relabelings: []
  traefik:
    namespace: traefik
    serviceMonitor:
      enabled: false
      labels:
        release: kube-prometheus-stack
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      port: metrics
      selector:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
  prometheusRule:
    enabled: false
    labels:
      release: kube-prometheus-stack
    thresholds:
      errorRatio: 0.05
      p95LatencySeconds: 1
      traefikErrorRatio: 0.05
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"
    annotations: {}

services:
  product:
    enabled: true
    name: product-service
    replicaCount: 2
    revisionHistoryLimit: 3
    image:
      repository: turborepo-monorepo-product-service
      tag: "0.1.0"
      digest: ""
      pullPolicy: ""
    service:
      type: ClusterIP
      port: 3000
      appProtocol: http
    containerPort: 3000
    env:
      PORT: "3000"
    secretEnv:
      DATABASE_URL: DATABASE_URL
      CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      CLERK_SECRET_KEY: CLERK_SECRET_KEY
      CLERK_JWT_KEY:
        key: CLERK_JWT_KEY
        optional: true
      ADMIN_USER_IDS: ADMIN_USER_IDS
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    rollout:
      minReadySeconds: 5
      progressDeadlineSeconds: 600

  order:
    enabled: true
    name: order-service
    replicaCount: 2
    revisionHistoryLimit: 3
    image:
      repository: turborepo-monorepo-order-service
      tag: "0.1.0"
      digest: ""
      pullPolicy: ""
    service:
      type: ClusterIP
      port: 8001
      appProtocol: http
    containerPort: 8001
    env:
      PORT: "8001"
    secretEnv:
      MONGO_URL: MONGO_URL
      CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      CLERK_SECRET_KEY: CLERK_SECRET_KEY
      CLERK_JWT_KEY:
        key: CLERK_JWT_KEY
        optional: true
      ADMIN_USER_IDS: ADMIN_USER_IDS
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    rollout:
      minReadySeconds: 5
      progressDeadlineSeconds: 600

  payment:
    enabled: true
    name: payment-service
    replicaCount: 2
    revisionHistoryLimit: 3
    image:
      repository: turborepo-monorepo-payment-service
      tag: "0.1.0"
      digest: ""
      pullPolicy: ""
    service:
      type: ClusterIP
      port: 8002
      appProtocol: http
    containerPort: 8002
    env:
      PORT: "8002"
      CLIENT_APP_URL: https://shop.example.com
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
    secretEnv:
      STRIPE_SECRET_KEY: STRIPE_SECRET_KEY
      STRIPE_WEBHOOK_SECRET: STRIPE_WEBHOOK_SECRET
      CLERK_PUBLISHABLE_KEY: CLERK_PUBLISHABLE_KEY
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      CLERK_SECRET_KEY: CLERK_SECRET_KEY
      CLERK_JWT_KEY:
        key: CLERK_JWT_KEY
        optional: true
      ADMIN_USER_IDS: ADMIN_USER_IDS
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /health/live
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    rollout:
      minReadySeconds: 5
      progressDeadlineSeconds: 600

  client:
    enabled: true
    name: client
    replicaCount: 2
    revisionHistoryLimit: 3
    image:
      repository: turborepo-monorepo-client
      tag: "0.1.0"
      digest: ""
      pullPolicy: ""
    service:
      type: ClusterIP
      port: 3002
      appProtocol: http
    containerPort: 3002
    env:
      PORT: "3002"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      CLIENT_APP_URL: https://shop.example.com
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.example.com
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.example.com
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.example.com
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.example.com
    secretEnv:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      CLERK_SECRET_KEY: CLERK_SECRET_KEY
      CLERK_JWT_KEY:
        key: CLERK_JWT_KEY
        optional: true
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    readinessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /api/health
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    extraVolumeMounts:
      - name: next-cache
        mountPath: /app/apps/client/.next/cache
    extraVolumes:
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    rollout:
      minReadySeconds: 5
      progressDeadlineSeconds: 600

  admin:
    enabled: true
    name: admin
    replicaCount: 2
    revisionHistoryLimit: 3
    image:
      repository: turborepo-monorepo-admin
      tag: "0.1.0"
      digest: ""
      pullPolicy: ""
    service:
      type: ClusterIP
      port: 3003
      appProtocol: http
    containerPort: 3003
    env:
      PORT: "3003"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      ADMIN_APP_URL: https://admin.example.com
      CLIENT_APP_URL: https://shop.example.com
      STOREFRONT_ASSET_ORIGIN: http://{{ include "ecommerce.fullname" . }}-client.{{ .Release.Namespace }}.svc.cluster.local:3002
      NEXT_PUBLIC_ADMIN_APP_URL: https://admin.example.com
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.example.com
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.example.com
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.example.com
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.example.com
    secretEnv:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
      CLERK_SECRET_KEY: CLERK_SECRET_KEY
      CLERK_JWT_KEY:
        key: CLERK_JWT_KEY
        optional: true
      ADMIN_USER_IDS: ADMIN_USER_IDS
    readinessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 6
    livenessProbe:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      httpGet:
        path: /api/health
        port: http
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    extraVolumeMounts:
      - name: next-cache
        mountPath: /app/apps/admin/.next/cache
    extraVolumes:
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
      unhealthyPodEvictionPolicy: AlwaysAllow
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    rollout:
      minReadySeconds: 5
      progressDeadlineSeconds: 600

jobs:
  migrate-product-db:
    enabled: true
    service: product
    command:
      - bun
      - packages/product-db/src/deploy-migrations.ts
    hook: pre-install,pre-upgrade
    hookWeight: "-10"
    deletePolicy: before-hook-creation,hook-succeeded
    backoffLimit: 3
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    secretEnv:
      DATABASE_URL: DATABASE_URL
  seed-product-db:
    enabled: false
    service: product
    command:
      - bun
      - run
      - apps/product-service/src/scripts/seed.ts
    hook: post-install,post-upgrade
    hookWeight: "10"
    deletePolicy: before-hook-creation,hook-succeeded
    backoffLimit: 1
    activeDeadlineSeconds: 900
    ttlSecondsAfterFinished: 3600
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    secretEnv:
      DATABASE_URL: DATABASE_URL
      STRIPE_SECRET_KEY: STRIPE_SECRET_KEY

networkPolicy:
  enabled: false
  allowExternalEgress: true
  allowDnsEgress: true
  ingressFrom: []
  extraEgress: []

helmTests:
  enabled: true
  activeDeadlineSeconds: 120
  image:
    repository: curlimages/curl
    tag: "8.21.0"
    digest: sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      memory: 64Mi
