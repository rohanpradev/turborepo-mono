{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce.secretName" . }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets.stringData }}
  {{ $name }}: {{ tpl (printf "%v" $value) $ | quote }}
  {{- end }}
{{- end }}
