{{- if .Values.networkPolicy.enabled }}
{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ecommerce.componentName" (dict "root" $ "service" $service) }}
  labels:
    {{- include "ecommerce.componentLabels" (dict "root" $ "service" $service) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if $.Values.networkPolicy.ingressFrom }}
        {{- toYaml $.Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
  egress:
    {{- if $.Values.networkPolicy.allowDnsEgress }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- with $.Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $.Values.networkPolicy.allowExternalEgress }}
    - {}
    {{- else if and (not $.Values.networkPolicy.allowDnsEgress) (not $.Values.networkPolicy.extraEgress) }}
    []
    {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
