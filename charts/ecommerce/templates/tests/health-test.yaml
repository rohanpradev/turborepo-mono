{{- if .Values.helmTests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ecommerce.fullname" . }}-health-test
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.helmTests.activeDeadlineSeconds }}
  os:
    name: linux
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.global.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ include "ecommerce.externalImage" .Values.helmTests.image | quote }}
      imagePullPolicy: {{ .Values.helmTests.image.pullPolicy }}
      terminationMessagePolicy: FallbackToLogsOnError
      securityContext:
        {{- toYaml .Values.global.containerSecurityContext | nindent 8 }}
      {{- with .Values.helmTests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command:
        - /bin/sh
        - -ec
        - |
          {{- if .Values.services.client.enabled }}
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --retry-max-time 15 --connect-timeout 5 --max-time 20 "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.client) }}:{{ .Values.services.client.service.port }}/api/health"
          {{- end }}
          {{- if .Values.services.admin.enabled }}
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --retry-max-time 15 --connect-timeout 5 --max-time 20 "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.admin) }}:{{ .Values.services.admin.service.port }}/api/health"
          {{- end }}
          {{- if .Values.services.product.enabled }}
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --retry-max-time 15 --connect-timeout 5 --max-time 20 "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.product) }}:{{ .Values.services.product.service.port }}/health/ready"
          {{- end }}
          {{- if .Values.services.order.enabled }}
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --retry-max-time 15 --connect-timeout 5 --max-time 20 "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.order) }}:{{ .Values.services.order.service.port }}/health/ready"
          {{- end }}
          {{- if .Values.services.payment.enabled }}
          curl -fsS --retry 5 --retry-connrefused --retry-delay 1 --retry-max-time 15 --connect-timeout 5 --max-time 20 "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.payment) }}:{{ .Values.services.payment.service.port }}/health/ready"
          {{- end }}
{{- end }}
