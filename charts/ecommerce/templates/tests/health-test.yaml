{{- if .Values.helmTests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ecommerce.fullname" . }}-health-test
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  securityContext:
    {{- toYaml .Values.global.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ include "ecommerce.externalImage" .Values.helmTests.image | quote }}
      imagePullPolicy: {{ .Values.helmTests.image.pullPolicy }}
      terminationMessagePolicy: FallbackToLogsOnError
      securityContext:
        {{- toYaml .Values.global.containerSecurityContext | nindent 8 }}
      {{- with .Values.helmTests.resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      command:
        - /bin/sh
        - -ec
        - |
          {{- if .Values.services.client.enabled }}
          curl -fsS "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.client) }}:3002/api/health"
          {{- end }}
          {{- if .Values.services.admin.enabled }}
          curl -fsS "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.admin) }}:3003/api/health"
          {{- end }}
          {{- if .Values.services.product.enabled }}
          curl -fsS "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.product) }}:3000/health/ready"
          {{- end }}
          {{- if .Values.services.order.enabled }}
          curl -fsS "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.order) }}:8001/health/ready"
          {{- end }}
          {{- if .Values.services.payment.enabled }}
          curl -fsS "http://{{ include "ecommerce.componentName" (dict "root" . "service" .Values.services.payment) }}:8002/health/ready"
          {{- end }}
{{- end }}
