{{- if and .Values.gateway.enabled .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ default (include "ecommerce.fullname" .) .Values.gateway.name }}
  {{- with .Values.gateway.namespace }}
  namespace: {{ . }}
  {{- end }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  listeners:
    {{- range .Values.gateway.listeners }}
    {{- $listener := deepCopy . }}
    {{- if not (hasKey $listener "allowedRoutes") }}
    {{- $selector := dict "matchLabels" (dict "kubernetes.io/metadata.name" $.Release.Namespace) }}
    {{- $namespaces := dict "from" "Selector" "selector" $selector }}
    {{- $_ := set $listener "allowedRoutes" (dict "namespaces" $namespaces) }}
    {{- end }}
    {{- toYaml (list $listener) | nindent 4 }}
    {{- end }}
{{- end }}
