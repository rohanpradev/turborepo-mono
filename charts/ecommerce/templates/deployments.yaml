{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
{{- $topologySpreadConstraints := coalesce $service.topologySpreadConstraints $.Values.global.topologySpreadConstraints }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecommerce.componentName" (dict "root" $ "service" $service) }}
  labels:
    {{- include "ecommerce.componentLabels" (dict "root" $ "service" $service) | nindent 4 }}
spec:
  {{- if not $service.autoscaling.enabled }}
  replicas: {{ $service.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ default 3 $service.revisionHistoryLimit }}
  {{- with $service.rollout }}
  {{- with .minReadySeconds }}
  minReadySeconds: {{ . }}
  {{- end }}
  {{- with .progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 8 }}
        {{- with $.Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if and (eq $key "payment") $.Values.stripeCli.enabled }}
        checksum/stripe-cli-config: {{ include (print $.Template.BasePath "/stripe-cli-configmap.yaml") $ | sha256sum }}
        {{- end }}
        {{- if $.Values.secrets.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
        {{- end }}
        {{- with $.Values.global.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      os:
        name: linux
      serviceAccountName: {{ include "ecommerce.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: {{ $.Values.global.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.global.podSecurityContext | nindent 8 }}
      {{- with $.Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml $topologySpreadConstraints | nindent 8 }}
      {{- else if $.Values.global.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $.Values.global.topologySpread.maxSkew }}
          topologyKey: {{ $.Values.global.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ $.Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 14 }}
          matchLabelKeys:
            - pod-template-hash
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: {{ include "ecommerce.image" (dict "root" $ "service" $service) | quote }}
          imagePullPolicy: {{ default $.Values.global.imagePullPolicy $service.image.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            {{- toYaml $.Values.global.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $service.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "ecommerce.configMapName" $ }}
          env:
            {{- range $name, $value := $service.env }}
            - name: {{ $name }}
              value: {{ tpl (printf "%v" $value) $ | quote }}
            {{- end }}
            {{- if and (eq $key "payment") $.Values.stripeCli.enabled }}
            - name: STRIPE_WEBHOOK_SECRET_FILE
              value: {{ $.Values.stripeCli.webhookSecretFile | quote }}
            {{- end }}
            {{- range $name, $secretKey := $service.secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  {{- if kindIs "map" $secretKey }}
                  key: {{ $secretKey.key }}
                  optional: {{ default false $secretKey.optional }}
                  {{- else }}
                  key: {{ $secretKey }}
                  {{- end }}
            {{- end }}
          {{- with $service.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $key "payment") $.Values.stripeCli.enabled }}
            - name: stripe-webhook-secret
              mountPath: {{ dir $.Values.stripeCli.webhookSecretFile | quote }}
              readOnly: true
            {{- end }}
            {{- with $service.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if and (eq $key "payment") $.Values.stripeCli.enabled }}
        - name: stripe-cli
          image: {{ include "ecommerce.externalImage" $.Values.stripeCli.image | quote }}
          imagePullPolicy: {{ $.Values.stripeCli.image.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            - /bin/sh
            - /opt/stripe/stripe-cli-listen.sh
          securityContext:
            {{- toYaml $.Values.global.containerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: STRIPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_FORWARD_TO
              value: {{ tpl $.Values.stripeCli.forwardTo $ | quote }}
            - name: STRIPE_WEBHOOK_SECRET_FILE
              value: {{ $.Values.stripeCli.webhookSecretFile | quote }}
            - name: STRIPE_CLI_EVENTS
              value: {{ $.Values.stripeCli.events | quote }}
          resources:
            {{- toYaml $.Values.stripeCli.resources | nindent 12 }}
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s "$STRIPE_WEBHOOK_SECRET_FILE"
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - test -s "$STRIPE_WEBHOOK_SECRET_FILE"
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: stripe-webhook-secret
              mountPath: {{ dir $.Values.stripeCli.webhookSecretFile | quote }}
            - name: stripe-cli-script
              mountPath: /opt/stripe/stripe-cli-listen.sh
              subPath: stripe-cli-listen.sh
              readOnly: true
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.global.tmp.sizeLimit }}
        {{- if and (eq $key "payment") $.Values.stripeCli.enabled }}
        - name: stripe-webhook-secret
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: stripe-cli-script
          configMap:
            name: {{ include "ecommerce.fullname" $ }}-stripe-cli
            defaultMode: 0555
        {{- end }}
        {{- with $service.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
{{- end }}
{{- end }}
