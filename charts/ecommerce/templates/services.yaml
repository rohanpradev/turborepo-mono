{{- range $key, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.componentName" (dict "root" $ "service" $service) }}
  labels:
    {{- include "ecommerce.componentLabels" (dict "root" $ "service" $service) | nindent 4 }}
spec:
  type: {{ $service.service.type }}
  ports:
    - name: http
      port: {{ $service.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 4 }}
---
{{- end }}
{{- end }}
