{{- range $name, $job := .Values.jobs }}
{{- if $job.enabled }}
{{- if and $.Values.secrets.create (contains "pre-install" $job.hook) }}
{{- fail (printf "job %s runs as a pre-install hook and requires an externally managed secret; set secrets.create=false and provision secrets.name before Helm runs" $name) }}
{{- end }}
{{- $service := required (printf "job %s must reference a valid service" $name) (index $.Values.services $job.service) }}
{{- if not $service.enabled }}
{{- fail (printf "job %s references disabled service %s" $name $job.service) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-%s" (include "ecommerce.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ecommerce.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name | quote }}
  annotations:
    "helm.sh/hook": {{ $job.hook | quote }}
    "helm.sh/hook-weight": {{ $job.hookWeight | quote }}
    "helm.sh/hook-delete-policy": {{ $job.deletePolicy | quote }}
spec:
  backoffLimit: {{ default 3 $job.backoffLimit }}
  {{- with $job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with $job.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "ecommerce.selectorLabels" (dict "root" $ "service" $service) | nindent 8 }}
        app.kubernetes.io/job-name: {{ $name | quote }}
    spec:
      os:
        name: linux
      restartPolicy: OnFailure
      # Pre-install hooks run before chart-managed service accounts exist and
      # these jobs do not call the Kubernetes API.
      serviceAccountName: default
      automountServiceAccountToken: false
      enableServiceLinks: {{ $.Values.global.enableServiceLinks }}
      terminationGracePeriodSeconds: {{ $.Values.global.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml $.Values.global.podSecurityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ecommerce.image" (dict "root" $ "service" $service) | quote }}
          imagePullPolicy: {{ default $.Values.global.imagePullPolicy $service.image.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          command:
            {{- toYaml $job.command | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.global.containerSecurityContext | nindent 12 }}
          {{- with $job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if not (contains "pre-install" $job.hook) }}
          envFrom:
            - configMapRef:
                name: {{ include "ecommerce.configMapName" $ }}
          {{- end }}
          env:
            {{- range $envName, $value := $job.env }}
            - name: {{ $envName }}
              value: {{ tpl (printf "%v" $value) $ | quote }}
            {{- end }}
            {{- range $envName, $secretKey := $job.secretEnv }}
            - name: {{ $envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce.secretName" $ }}
                  key: {{ $secretKey }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ $.Values.global.tmp.sizeLimit }}
---
{{- end }}
{{- end }}
