{{- if .Values.gateway.enabled }}
{{- range $host := .Values.ingress.hosts }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-%s" (include "ecommerce.fullname" $) ($host.host | replace "." "-") | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "ecommerce.labels" $ | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name }}
      {{- with $.Values.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with $.Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ $host.host | quote }}
  rules:
    {{- range $path := $host.paths }}
    {{- $target := required (printf "gateway path %s must reference a valid service" $path.path) (index $.Values.services $path.service) }}
    {{- if not $target.enabled }}
    {{- fail (printf "gateway path %s references disabled service %s" $path.path $path.service) }}
    {{- end }}
    - matches:
        - path:
            {{- if eq (default "Prefix" $path.pathType) "Exact" }}
            type: Exact
            {{- else }}
            type: PathPrefix
            {{- end }}
            value: {{ $path.path | quote }}
      backendRefs:
        - name: {{ include "ecommerce.componentName" (dict "root" $ "service" $target) }}
          port: {{ ternary $target.service.port $path.port (kindIs "string" $path.port) }}
    {{- end }}
---
{{- end }}
{{- end }}
