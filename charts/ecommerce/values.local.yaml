global:
  imagePullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    REQUEST_TIMEOUT_MS: "30000"
    KAFKA_BROKERS: kafka-broker-1.kafka.svc.cluster.local:9092,kafka-broker-2.kafka.svc.cluster.local:9092,kafka-broker-3.kafka.svc.cluster.local:9092
    KAFKA_LOG_LEVEL: error
    KAFKA_CONNECTION_TIMEOUT_MS: "3000"
    KAFKA_REQUEST_TIMEOUT_MS: "25000"
    KAFKA_TOPIC_NUM_PARTITIONS: "3"
    KAFKA_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "2"
    KAFKA_UI_URL: https://kafka.localhost
    CORS_ALLOWED_ORIGINS: https://shop.localhost,https://admin.localhost,http://localhost:3002,http://localhost:3003

ingress:
  enabled: false

gateway:
  enabled: true
  create: false
  name: traefik-gateway
  namespace: traefik
  sectionName: websecure

secrets:
  create: false
  stringData:
    DATABASE_URL: postgresql://postgres:postgres@postgres.postgres.svc.cluster.local:5432/product_db?schema=public
    MONGO_URL: mongodb://mongodb.mongodb.svc.cluster.local:27017/order_db
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    CLERK_PUBLISHABLE_KEY: ""
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    CLERK_SECRET_KEY: ""
    ADMIN_USER_IDS: ""

services:
  product:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
  order:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
  payment:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    env:
      CLIENT_APP_URL: https://shop.localhost
  client:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    env:
      CLIENT_APP_URL: https://shop.localhost
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.localhost
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost
  admin:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    env:
      ADMIN_APP_URL: https://admin.localhost
      CLIENT_APP_URL: https://shop.localhost
      NEXT_PUBLIC_ADMIN_APP_URL: https://admin.localhost
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost
