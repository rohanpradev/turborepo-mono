# Disposable test dependencies only; no application volumes or credentials.
name: ecommerce-integration
services:
  postgres:
    image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_PASSWORD: integration-only
      POSTGRES_DB: commerce_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d commerce_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  mongo:
    image: mongodb/mongodb-community-server:8.3.17-ubuntu2204-slim-20261111T065308Z@sha256:66a8943ca696bc5a5adc4e04014814bb0bc6fd412222fda85caadcaf08c1d56c
    ports: ["127.0.0.1:57017:27017"]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "db.adminCommand({ping:1})"]
      interval: 2s
      timeout: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports: ["127.0.0.1:59092:9094"]
    environment:
      CLUSTER_ID: gNtGMiY7RJqk7wdUNktAvg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test:
        [
          CMD,
          /opt/kafka/bin/kafka-topics.sh,
          --bootstrap-server,
          localhost:9092,
          --list,
        ]
      interval: 5s
      timeout: 10s
      retries: 30
