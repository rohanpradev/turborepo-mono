# Default local Kubernetes profile with Docker-backed dependencies.
# Routing is explicit here; Make only injects secret names and immutable image tags.

global:
  imagePullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    REQUEST_TIMEOUT_MS: "30000"
    KAFKA_BROKERS: host.docker.internal:19094,host.docker.internal:19095,host.docker.internal:19096
    KAFKA_LOG_LEVEL: error
    KAFKA_CONNECTION_TIMEOUT_MS: "3000"
    KAFKA_REQUEST_TIMEOUT_MS: "25000"
    KAFKA_TOPIC_NUM_PARTITIONS: "3"
    KAFKA_TOPIC_REPLICATION_FACTOR: "1"
    KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "1"
    KAFKA_UI_URL: ""
    # The local profile is exposed through `make k8s` on 9443. Browser
    # origins include the port, so both CORS and Clerk must use the exact
    # public origins rather than their privileged-HTTPS equivalents.
    CORS_ALLOWED_ORIGINS: https://shop.localhost,https://admin.localhost,https://shop.localhost:9443,https://admin.localhost:9443,http://localhost:3002,http://localhost:3003
    CLERK_AUTHORIZED_PARTIES: https://shop.localhost,https://admin.localhost,https://shop.localhost:9443,https://admin.localhost:9443,http://localhost:3002,http://localhost:3003
    TELEMETRY_ENABLED: "true"
    TELEMETRY_LOG_FORMAT: json
    PROMETHEUS_METRICS_ENABLED: "true"
    PROMETHEUS_METRICS_PATH: /metrics

ingress:
  enabled: true
  hosts:
    - host: shop.localhost
      paths:
        - path: /
          pathType: Prefix
          service: client
          port: http
    - host: admin.localhost
      paths:
        - path: /
          pathType: Prefix
          service: admin
          port: http
    - host: api.localhost
      paths:
        - path: /rpc/product
          pathType: Prefix
          service: product
          port: http
        - path: /rpc/payment
          pathType: Prefix
          service: payment
          port: http
        - path: /rpc/order
          pathType: Prefix
          service: order
          port: http
        - path: /api/webhooks
          pathType: Prefix
          service: payment
          port: http

gateway:
  enabled: false
  create: false
  name: traefik-gateway
  namespace: traefik
  sectionName: websecure

stripeCli:
  enabled: true

secrets:
  create: false

services:
  product:
    enabled: true
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
  order:
    enabled: true
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
  payment:
    enabled: true
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      CLIENT_APP_URL: https://shop.localhost:9443
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
  client:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      CLIENT_APP_URL: https://shop.localhost:9443
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.localhost:9443
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost:9443
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost:9443
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost:9443
  admin:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      ADMIN_APP_URL: https://admin.localhost:9443
      CLIENT_APP_URL: https://shop.localhost:9443
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.localhost:9443
      NEXT_PUBLIC_ADMIN_APP_URL: https://admin.localhost:9443
      PRODUCT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://{{ include "ecommerce.fullname" . }}-payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost:9443
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost:9443
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost:9443

jobs:
  migrate-product-db:
    enabled: true
  seed-product-db:
    enabled: true
