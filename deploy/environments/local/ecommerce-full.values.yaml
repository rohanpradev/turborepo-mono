# Full local Kubernetes profile with all application workloads.
# Routing is explicit here; Make only injects secret names and immutable image tags.

global:
  imagePullPolicy: IfNotPresent
  env:
    NODE_ENV: production
    REQUEST_TIMEOUT_MS: "30000"
    KAFKA_BROKERS: host.docker.internal:9094,host.docker.internal:9095,host.docker.internal:9096
    KAFKA_LOG_LEVEL: error
    KAFKA_CONNECTION_TIMEOUT_MS: "3000"
    KAFKA_REQUEST_TIMEOUT_MS: "25000"
    KAFKA_TOPIC_NUM_PARTITIONS: "3"
    KAFKA_TOPIC_REPLICATION_FACTOR: "3"
    KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "2"
    KAFKA_UI_URL: https://kafka.localhost
    CORS_ALLOWED_ORIGINS: https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003
    CLERK_AUTHORIZED_PARTIES: https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003
    TELEMETRY_ENABLED: "true"
    TELEMETRY_LOG_FORMAT: json
    PROMETHEUS_METRICS_ENABLED: "true"
    PROMETHEUS_METRICS_PATH: /metrics

ingress:
  enabled: true

gateway:
  enabled: false
  create: false
  name: traefik-gateway
  namespace: traefik
  sectionName: websecure

secrets:
  create: false
  stringData:
    DATABASE_URL: postgresql://postgres:postgres@postgres.postgres.svc.cluster.local:5432/product_db?schema=public
    MONGO_URL: mongodb://mongodb.mongodb.svc.cluster.local:27017/order_db
    STRIPE_SECRET_KEY: ""
    STRIPE_WEBHOOK_SECRET: ""
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
    CLERK_PUBLISHABLE_KEY: ""
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
    CLERK_SECRET_KEY: ""
    CLERK_JWT_KEY: ""
    ADMIN_USER_IDS: ""

services:
  product:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
  order:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
  payment:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      CLIENT_APP_URL: https://shop.localhost
  client:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      CLIENT_APP_URL: https://shop.localhost:8443
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.localhost:8443
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost:8443
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost:8443
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost:8443
  admin:
    replicaCount: 1
    image:
      pullPolicy: IfNotPresent
    podDisruptionBudget:
      enabled: false
    env:
      ADMIN_APP_URL: https://admin.localhost
      CLIENT_APP_URL: https://shop.localhost:8443
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.localhost:8443
      NEXT_PUBLIC_ADMIN_APP_URL: https://admin.localhost:8443
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.localhost:8443
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.localhost:8443
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.localhost:8443

jobs:
  seed-product-db:
    enabled: true
