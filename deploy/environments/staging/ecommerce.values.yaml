# TEMPLATE: replace .invalid hosts, TEST-NET CIDRs, registry and all image digests.
# Requires external databases, a TLS/SASL broker, ingress and monitoring CRDs.
global:
  requireImageDigests: true
  imageRegistry: registry.invalid/commerce
  env:
    KAFKA_BROKERS: broker.invalid:9093
    KAFKA_SSL: "true"
    KAFKA_SASL_MECHANISM: scram-sha-512
    CORS_ALLOWED_ORIGINS: https://shop.staging.invalid,https://admin.staging.invalid
    CLERK_AUTHORIZED_PARTIES: https://shop.staging.invalid,https://admin.staging.invalid
secrets:
  create: false
  name: commerce-staging-runtime
stripeCli:
  enabled: false
ingress:
  tls:
    secretName: commerce-staging-tls
  hosts:
    - host: shop.staging.invalid
      paths: [{path: /, pathType: Prefix, service: client, port: http}]
    - host: admin.staging.invalid
      paths: [{path: /, pathType: Prefix, service: admin, port: http}]
    - host: api.staging.invalid
      paths:
        - {path: /rpc/product, pathType: Prefix, service: product, port: http}
        - {path: /rpc/order, pathType: Prefix, service: order, port: http}
        - {path: /rpc/payment, pathType: Prefix, service: payment, port: http}
        - {path: /api/webhooks, pathType: Prefix, service: payment, port: http}
networkPolicy:
  enabled: true
  allowExternalEgress: false
  ingressFrom:
    - podSelector: {}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: traefik}
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: monitoring}
  extraEgress:
    - to: [{podSelector: {}}]
      ports:
        - {protocol: TCP, port: 3000}
        - {protocol: TCP, port: 3002}
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8002}
    # TEST-NET placeholder: replace with actual managed database/broker CIDRs.
    - to: [{ipBlock: {cidr: 192.0.2.0/24}}]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 27017}
        - {protocol: TCP, port: 9093}
    # Stripe and Clerk use changing public addresses. Prefer an audited egress proxy.
    - ports: [{protocol: TCP, port: 443}]
observability:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
jobs:
  seed-product-db:
    enabled: false
services:
  product:
    replicaCount: 2
    secretEnv:
      KAFKA_SASL_USERNAME: KAFKA_SASL_USERNAME
      KAFKA_SASL_PASSWORD: KAFKA_SASL_PASSWORD
  order:
    replicaCount: 2
    secretEnv:
      KAFKA_SASL_USERNAME: KAFKA_SASL_USERNAME
      KAFKA_SASL_PASSWORD: KAFKA_SASL_PASSWORD
  payment:
    replicaCount: 2
    secretEnv:
      KAFKA_SASL_USERNAME: KAFKA_SASL_USERNAME
      KAFKA_SASL_PASSWORD: KAFKA_SASL_PASSWORD
    env:
      CLIENT_APP_URL: https://shop.staging.invalid
  client:
    replicaCount: 2
    env:
      CLIENT_APP_URL: https://shop.staging.invalid
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.staging.invalid
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.staging.invalid
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.staging.invalid
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.staging.invalid
  admin:
    replicaCount: 2
    env:
      CLIENT_APP_URL: https://shop.staging.invalid
      NEXT_PUBLIC_CLIENT_APP_URL: https://shop.staging.invalid
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: https://api.staging.invalid
      NEXT_PUBLIC_ORDER_SERVICE_URL: https://api.staging.invalid
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: https://api.staging.invalid
      ADMIN_APP_URL: https://admin.staging.invalid
      NEXT_PUBLIC_ADMIN_APP_URL: https://admin.staging.invalid
