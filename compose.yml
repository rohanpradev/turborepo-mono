x-runtime-security: &runtime-security
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-service: &app-service
  <<: *runtime-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
  NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${DOCKER_PUBLIC_PRODUCT_SERVICE_URL:-https://api.localhost:8443}
  NEXT_PUBLIC_ORDER_SERVICE_URL: ${DOCKER_PUBLIC_ORDER_SERVICE_URL:-https://api.localhost:8443}
  NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${DOCKER_PUBLIC_PAYMENT_SERVICE_URL:-https://api.localhost:8443}

x-kafka-broker-env: &kafka-broker-env
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker-1:9093,2@kafka-broker-2:9093,3@kafka-broker-3:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,KUBERNETES:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

services:
  # Docker Hardened Images require an authenticated pull:
  #   docker login dhi.io

  docker-socket-proxy:
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.4.2@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: docker-socket-proxy
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      VERSION: 1
    expose:
      - "2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ecommerce-network
    restart: unless-stopped

  traefik:
    <<: *runtime-security
    image: traefik:v3.7.7@sha256:1cb3845d7a05e1473c9086351426597e911db49db382b6e4769f9b0744962ac8
    container_name: ecommerce-traefik
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "${TRAEFIK_HTTP_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTP_PORT:-8080}:8000"
      - "${TRAEFIK_HTTPS_BIND_ADDRESS:-127.0.0.1}:${TRAEFIK_HTTPS_PORT:-8443}:8443"
    depends_on:
      - docker-socket-proxy
    command:
      - "--entrypoints.web.address=:8000"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:8443"
      - "--entrypoints.websecure.http.tls=true"
      - "--entrypoints.traefik.address=:8080"
      - "--api=true"
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entrypoint=traefik"
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.watch=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=ecommerce-network"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
    volumes:
      - ./docker/certs:/certs:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.priority=1000"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS_DOCKER:-admin:$$apr1$$l2NjIjPT$$rpBpr/hrawWdK.VRWyKo3/}"
      - "traefik.http.middlewares.dashboard-auth.basicauth.removeheader=true"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    <<: *runtime-security
    image: dhi.io/postgres:18.4-debian13@sha256:a807e832c1fc9ded731956abcb53dc98ed003fd82e27275eaef8dcf52fb90236
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-product_db}
      POSTGRES_INITDB_ARGS: --auth=scram-sha-256
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - ecommerce-network
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-postgres}",
          "-d",
          "${POSTGRES_DB:-product_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    <<: *runtime-security
    image: dhi.io/mongodb:8.3.4-debian13@sha256:dd3953a42bf74156b803c53b85a150fbc0505c3b162bc425842c97ba642e5ea5
    platform: linux/amd64
    container_name: ecommerce-mongodb
    command:
      - "--bind_ip_all"
      - "--noauth"
      - "--dbpath"
      - "/data/db"
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ecommerce-network

  mongodb-ready:
    <<: *runtime-security
    image: dhi.io/bun:1.3.14-debian13@sha256:fb5dda72d73bd1e581d014e6546352766f8565bb78ce66a290e4f11fdc188c11
    container_name: ecommerce-mongodb-ready
    command:
      [
        "bun",
        "-e",
        "const net = await import('node:net'); for (let i = 0; i < 60; i++) { try { await new Promise((resolve, reject) => { const socket = net.connect(27017, 'mongodb'); socket.once('connect', () => { socket.end(); resolve(); }); socket.once('error', reject); socket.setTimeout(1000, () => { socket.destroy(); reject(new Error('timeout')); }); }); process.exit(0); } catch { await Bun.sleep(1000); } } process.exit(1);",
      ]
    depends_on:
      - mongodb
    networks:
      - ecommerce-network
    restart: "no"

  product-db-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.product-service
      target: builder
    container_name: ecommerce-product-db-migrate
    command: ["bun", "run", "--cwd", "packages/product-db", "db:deploy"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/product_db?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: "no"

  product-db-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.product-service
      target: builder
    container_name: ecommerce-product-db-seed
    command: ["bun", "run", "apps/product-service/src/scripts/seed.ts"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/product_db?schema=public}
      KAFKA_BROKERS: ${DOCKER_KAFKA_BROKERS:-kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
    depends_on:
      postgres:
        condition: service_healthy
      product-db-migrate:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: "no"

  kafka-broker-1:
    <<: *runtime-security
    image: dhi.io/kafka:4.3.1-debian13-native@sha256:89691f2d47ded5c88186e0e61a68b2fe77e2a19dea29ad2669e5626aff7965ff
    container_name: kafka-broker-1
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094,KUBERNETES://0.0.0.0:19094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-1:9092,EXTERNAL://localhost:9094,KUBERNETES://host.docker.internal:19094
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9094:9094"
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:19094:19094"
    volumes:
      - kafka-broker-1-data:/opt/kafka/logs
    healthcheck:
      # Docker Hardened Kafka does not expose the classic Kafka shell scripts on PATH.
      # A local TCP probe is the most reliable readiness check for the broker process.
      test:
        ["CMD", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  kafka-broker-2:
    <<: *runtime-security
    image: dhi.io/kafka:4.3.1-debian13-native@sha256:89691f2d47ded5c88186e0e61a68b2fe77e2a19dea29ad2669e5626aff7965ff
    container_name: kafka-broker-2
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9095,KUBERNETES://0.0.0.0:19095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-2:9092,EXTERNAL://localhost:9095,KUBERNETES://host.docker.internal:19095
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9095:9095"
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:19095:19095"
    volumes:
      - kafka-broker-2-data:/opt/kafka/logs
    healthcheck:
      # Docker Hardened Kafka does not expose the classic Kafka shell scripts on PATH.
      # A local TCP probe is the most reliable readiness check for the broker process.
      test:
        ["CMD", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  kafka-broker-3:
    <<: *runtime-security
    image: dhi.io/kafka:4.3.1-debian13-native@sha256:89691f2d47ded5c88186e0e61a68b2fe77e2a19dea29ad2669e5626aff7965ff
    container_name: kafka-broker-3
    environment:
      <<: *kafka-broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9096,KUBERNETES://0.0.0.0:19096
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker-3:9092,EXTERNAL://localhost:9096,KUBERNETES://host.docker.internal:19096
    ports:
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:9096:9096"
      - "${KAFKA_BIND_ADDRESS:-127.0.0.1}:19096:19096"
    volumes:
      - kafka-broker-3-data:/opt/kafka/logs
    healthcheck:
      # Docker Hardened Kafka does not expose the classic Kafka shell scripts on PATH.
      # A local TCP probe is the most reliable readiness check for the broker process.
      test:
        ["CMD", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-network

  kafka-ui:
    <<: *app-service
    image: ghcr.io/kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    container_name: kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
      KAFKA_CLUSTERS_0_READONLY: true
      KAFKA_CLUSTERS_0_TOPIC_AUTO_CREATE: false
    expose:
      - "8080"
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.kafka-ui.rule=Host(`kafka.localhost`)"
      - "traefik.http.routers.kafka-ui.entrypoints=websecure"
      - "traefik.http.routers.kafka-ui.tls=true"
      - "traefik.http.middlewares.kafka-ui-auth.basicauth.users=${TRAEFIK_BASIC_AUTH_USERS_DOCKER:-admin:$$apr1$$l2NjIjPT$$rpBpr/hrawWdK.VRWyKo3/}"
      - "traefik.http.middlewares.kafka-ui-auth.basicauth.removeheader=true"
      - "traefik.http.routers.kafka-ui.middlewares=kafka-ui-auth@docker"
      - "traefik.http.services.kafka-ui.loadbalancer.server.port=8080"

  product-service:
    <<: *app-service
    build:
      context: .
      dockerfile: docker/Dockerfile.product-service
    container_name: ecommerce-product-service
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/product_db?schema=public}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      KAFKA_BROKERS: ${DOCKER_KAFKA_BROKERS:-kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_LOG_FORMAT: ${TELEMETRY_LOG_FORMAT:-json}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      PROMETHEUS_METRICS_PATH: ${PROMETHEUS_METRICS_PATH:-/metrics}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      product-db-migrate:
        condition: service_completed_successfully
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/health/ready'); if (!response.ok) process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.product-service.rule=Host(`api.localhost`) && PathPrefix(`/rpc/product`)"
      - "traefik.http.routers.product-service.entrypoints=websecure"
      - "traefik.http.routers.product-service.tls=true"
      - "traefik.http.routers.product-service.priority=200"
      - "traefik.http.services.product-service.loadbalancer.server.port=3000"

  order-service:
    <<: *app-service
    build:
      context: .
      dockerfile: docker/Dockerfile.order-service
    container_name: ecommerce-order-service
    environment:
      NODE_ENV: production
      PORT: 8001
      MONGO_URL: ${DOCKER_MONGO_URL:-mongodb://mongodb:27017/order_db}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      KAFKA_BROKERS: ${DOCKER_KAFKA_BROKERS:-kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_LOG_FORMAT: ${TELEMETRY_LOG_FORMAT:-json}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      PROMETHEUS_METRICS_PATH: ${PROMETHEUS_METRICS_PATH:-/metrics}
    expose:
      - "8001"
    depends_on:
      mongodb-ready:
        condition: service_completed_successfully
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:8001/health/ready'); if (!response.ok) process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.order-service.rule=Host(`api.localhost`) && PathPrefix(`/rpc/order`)"
      - "traefik.http.routers.order-service.entrypoints=websecure"
      - "traefik.http.routers.order-service.tls=true"
      - "traefik.http.routers.order-service.priority=150"
      - "traefik.http.services.order-service.loadbalancer.server.port=8001"

  payment-service:
    <<: *app-service
    build:
      context: .
      dockerfile: docker/Dockerfile.payment-service
    container_name: ecommerce-payment-service
    environment:
      NODE_ENV: production
      PORT: 8002
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_FILE: /var/run/stripe/webhook-secret
      CLIENT_APP_URL: ${DOCKER_CLIENT_APP_URL:-https://shop.localhost:8443}
      PRODUCT_SERVICE_INTERNAL_URL: http://product-service:3000
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      KAFKA_BROKERS: ${DOCKER_KAFKA_BROKERS:-kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
      CORS_ALLOWED_ORIGINS: ${DOCKER_CORS_ALLOWED_ORIGINS:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      TELEMETRY_LOG_FORMAT: ${TELEMETRY_LOG_FORMAT:-json}
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      PROMETHEUS_METRICS_PATH: ${PROMETHEUS_METRICS_PATH:-/metrics}
    expose:
      - "8002"
    volumes:
      - stripe_runtime:/var/run/stripe:ro
    depends_on:
      kafka-broker-1:
        condition: service_healthy
      kafka-broker-2:
        condition: service_healthy
      kafka-broker-3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:8002/health/ready'); if (!response.ok) process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.payment-service.rule=Host(`api.localhost`) && PathPrefix(`/rpc/payment`)"
      - "traefik.http.routers.payment-webhooks.rule=Host(`api.localhost`) && PathPrefix(`/api/webhooks`)"
      - "traefik.http.routers.payment-service.entrypoints=websecure"
      - "traefik.http.routers.payment-service.tls=true"
      - "traefik.http.routers.payment-webhooks.entrypoints=websecure"
      - "traefik.http.routers.payment-webhooks.tls=true"
      - "traefik.http.routers.payment-service.service=payment-service"
      - "traefik.http.routers.payment-webhooks.service=payment-service"
      - "traefik.http.routers.payment-service.priority=250"
      - "traefik.http.routers.payment-webhooks.priority=250"
      - "traefik.http.services.payment-service.loadbalancer.server.port=8002"
      - "traefik.http.services.payment-service.loadbalancer.server.scheme=http"

  stripe-cli:
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    image: stripe/stripe-cli:v1.43.8@sha256:73a0449969bcb4bfa5a53ecb6db82f1ff873189d9e433aff72fa4c8e747acf81
    container_name: ecommerce-stripe-cli
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_FORWARD_TO: ${STRIPE_WEBHOOK_FORWARD_TO:-http://payment-service:8002/api/webhooks/stripe}
      STRIPE_CLI_EVENTS: ${STRIPE_CLI_EVENTS:-checkout.session.completed,payment_intent.succeeded,payment_intent.payment_failed}
      STRIPE_WEBHOOK_SECRET_FILE: /var/run/stripe/webhook-secret
    entrypoint:
      - /bin/sh
      - /stripe/stripe-cli-listen.sh
    depends_on:
      payment-service:
        condition: service_healthy
    volumes:
      - ./docker/stripe-cli-listen.sh:/stripe/stripe-cli-listen.sh:ro
      - stripe_runtime:/var/run/stripe
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/stripe/webhook-secret"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - ecommerce-network

  client:
    <<: *app-service
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/client/.next/cache:size=256m,mode=1777
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        <<: *frontend-build-args
        NEXT_PUBLIC_CLIENT_APP_URL: ${DOCKER_PUBLIC_CLIENT_APP_URL:-https://shop.localhost:8443}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: ecommerce-client
    environment:
      NODE_ENV: production
      PORT: 3002
      CLIENT_APP_URL: ${DOCKER_CLIENT_APP_URL:-https://shop.localhost:8443}
      NEXT_PUBLIC_CLIENT_APP_URL: ${DOCKER_PUBLIC_CLIENT_APP_URL:-https://shop.localhost:8443}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      PRODUCT_SERVICE_INTERNAL_URL: http://product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${DOCKER_PUBLIC_PRODUCT_SERVICE_URL:-https://api.localhost:8443}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${DOCKER_PUBLIC_ORDER_SERVICE_URL:-https://api.localhost:8443}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${DOCKER_PUBLIC_PAYMENT_SERVICE_URL:-https://api.localhost:8443}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    expose:
      - "3002"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      product-db-seed:
        condition: service_completed_successfully
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.client.rule=Host(`shop.localhost`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls=true"
      - "traefik.http.services.client.loadbalancer.server.port=3002"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3002/api/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  admin:
    <<: *app-service
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/apps/admin/.next/cache:size=256m,mode=1777
    build:
      context: .
      dockerfile: docker/Dockerfile.admin
      args:
        <<: *frontend-build-args
        NEXT_PUBLIC_ADMIN_APP_URL: ${DOCKER_PUBLIC_ADMIN_APP_URL:-https://admin.localhost:8443}
    container_name: ecommerce-admin
    environment:
      NODE_ENV: production
      PORT: 3003
      ADMIN_APP_URL: ${DOCKER_ADMIN_APP_URL:-https://admin.localhost:8443}
      CLIENT_APP_URL: ${DOCKER_CLIENT_APP_URL:-https://shop.localhost:8443}
      NEXT_PUBLIC_ADMIN_APP_URL: ${DOCKER_PUBLIC_ADMIN_APP_URL:-https://admin.localhost:8443}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-https://shop.localhost:8443,https://admin.localhost:8443,http://localhost:3002,http://localhost:3003}
      PRODUCT_SERVICE_INTERNAL_URL: http://product-service:3000
      ORDER_SERVICE_INTERNAL_URL: http://order-service:8001
      PAYMENT_SERVICE_INTERNAL_URL: http://payment-service:8002
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${DOCKER_PUBLIC_PRODUCT_SERVICE_URL:-https://api.localhost:8443}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${DOCKER_PUBLIC_ORDER_SERVICE_URL:-https://api.localhost:8443}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${DOCKER_PUBLIC_PAYMENT_SERVICE_URL:-https://api.localhost:8443}
    expose:
      - "3003"
    depends_on:
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      product-db-seed:
        condition: service_completed_successfully
    networks:
      - ecommerce-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ecommerce-network"
      - "traefik.http.routers.admin.rule=Host(`admin.localhost`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.services.admin.loadbalancer.server.port=3003"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3003/api/health'); if (!response.ok) process.exit(1);",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ecommerce-network:
    driver: bridge
    name: ecommerce-network

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  stripe_runtime:
    driver: local
  kafka-broker-1-data:
    driver: local
  kafka-broker-2-data:
    driver: local
  kafka-broker-3-data:
    driver: local
