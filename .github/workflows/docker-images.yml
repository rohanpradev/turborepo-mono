name: Docker images

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
    secrets:
      GHCR_PAT:
        required: false

env:
  BUN_DEV_IMAGE: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
  BUN_RUNTIME_IMAGE: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
  BUILDX_VERSION: v0.38.1
  BUILDKIT_IMAGE: moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
  REGISTRY: ghcr.io
  TURBO_VERSION: 2.11.11

jobs:
  build:
    name: ${{ matrix.service.name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      PUBLISH_IMAGES: ${{ inputs.publish }}
      # Published images use the public storefront unless a deployment-specific
      # image-optimizer origin is configured explicitly.
      NEXT_PUBLIC_IMAGE_REMOTE_HOSTS: ${{ vars.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
      NEXT_IMAGE_STOREFRONT_ORIGIN: ${{ vars.NEXT_IMAGE_STOREFRONT_ORIGIN || vars.NEXT_PUBLIC_CLIENT_APP_URL }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL }}
      NEXT_PUBLIC_CLIENT_APP_URL: ${{ vars.NEXT_PUBLIC_CLIENT_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${{ vars.NEXT_PUBLIC_ORDER_SERVICE_URL }}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: admin
            dockerfile: docker/Dockerfile.admin
          - name: client
            dockerfile: docker/Dockerfile.client
          - name: product-service
            dockerfile: docker/Dockerfile.product-service
          - name: order-service
            dockerfile: docker/Dockerfile.order-service
          - name: payment-service
            dockerfile: docker/Dockerfile.payment-service

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Compute image prefix
        id: image_prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Validate publish-time public configuration
        if: env.PUBLISH_IMAGES == 'true' && (matrix.service.name == 'client' || matrix.service.name == 'admin')
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_ADMIN_APP_URL
            NEXT_PUBLIC_CLIENT_APP_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            NEXT_PUBLIC_ORDER_SERVICE_URL
            NEXT_PUBLIC_PAYMENT_SERVICE_URL
            NEXT_PUBLIC_PRODUCT_SERVICE_URL
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          )
          for variable in "${required[@]}"; do
            test -n "${!variable}" || {
              echo "Missing required repository variable: ${variable}" >&2
              exit 1
            }
          done

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Run Docker build checks
        run: |
          docker buildx build \
            --check \
            --file "${{ matrix.service.dockerfile }}" \
            --build-arg "BUN_DEV_IMAGE=${BUN_DEV_IMAGE}" \
            --build-arg "BUN_RUNTIME_IMAGE=${BUN_RUNTIME_IMAGE}" \
            --build-arg "TURBO_VERSION=${TURBO_VERSION}" \
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${NEXT_PUBLIC_IMAGE_REMOTE_HOSTS}" \
            --build-arg "NEXT_IMAGE_ALLOW_LOCAL_IP=false" \
            --build-arg "NEXT_IMAGE_STOREFRONT_ORIGIN=${NEXT_IMAGE_STOREFRONT_ORIGIN}" \
            --build-arg "NEXT_PUBLIC_ADMIN_APP_URL=${NEXT_PUBLIC_ADMIN_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLIENT_APP_URL=${NEXT_PUBLIC_CLIENT_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" \
            --build-arg "NEXT_PUBLIC_ORDER_SERVICE_URL=${NEXT_PUBLIC_ORDER_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PAYMENT_SERVICE_URL=${NEXT_PUBLIC_PAYMENT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PRODUCT_SERVICE_URL=${NEXT_PUBLIC_PRODUCT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" \
            .

      - name: Build image for runtime verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          load: true
          push: false
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ env.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_IMAGE_ALLOW_LOCAL_IP=false
            NEXT_IMAGE_STOREFRONT_ORIGIN=${{ env.NEXT_IMAGE_STOREFRONT_ORIGIN }}
            NEXT_PUBLIC_ADMIN_APP_URL=${{ env.NEXT_PUBLIC_ADMIN_APP_URL }}
            NEXT_PUBLIC_CLIENT_APP_URL=${{ env.NEXT_PUBLIC_CLIENT_APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_PRODUCT_SERVICE_URL=${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ecommerce-ci/${{ matrix.service.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: linux/amd64
          # The local Docker exporter cannot retain attestations; publish them below.
          provenance: false
          sbom: false

      - name: Test restricted production image before publishing
        run: bash docker/test-image.sh "${{ matrix.service.name }}" "ecommerce-ci/${{ matrix.service.name }}:${{ github.sha }}"

      - name: Log in to Container Registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        id: publish
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          push: true
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ env.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_IMAGE_ALLOW_LOCAL_IP=false
            NEXT_IMAGE_STOREFRONT_ORIGIN=${{ env.NEXT_IMAGE_STOREFRONT_ORIGIN }}
            NEXT_PUBLIC_ADMIN_APP_URL=${{ env.NEXT_PUBLIC_ADMIN_APP_URL }}
            NEXT_PUBLIC_CLIENT_APP_URL=${{ env.NEXT_PUBLIC_CLIENT_APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_PRODUCT_SERVICE_URL=${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Record published image digest
        if: env.PUBLISH_IMAGES == 'true'
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}/${{ matrix.service.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: printf '`%s@%s`\n' "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
