name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  BUN_DEV_IMAGE: oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
  BUN_RUNTIME_IMAGE: oven/bun:1.4.0@sha256:5ff609364c049b54eb0ff560ec96319729a972078ef2c755d758f0c6ef89c2d6
  BUILDX_VERSION: v0.36.1
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  HELM_VERSION: 4.2.4
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  K8S_SUPPORTED_VERSIONS: 1.35.8 1.36.4
  K8S_EXPERIMENTAL_VERSIONS: 1.37.0
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  TURBO_VERSION: 2.10.12
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/admin/.next/cache
            apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/admin/**', 'apps/client/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Cache Knip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/knip
          key: ${{ runner.os }}-knip-${{ hashFiles('bun.lock', 'knip.json') }}
          restore-keys: |
            ${{ runner.os }}-knip-

      - name: Install dependencies
        run: bun ci

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file .env.example config > /tmp/compose.rendered.yml
          docker compose -f packages/kafka/compose.yml config > /tmp/kafka.compose.rendered.yml

      - name: Validate Helm profiles across the Kubernetes matrix
        run: |
          make helm-validate-supported
          make helm-validate-experimental
          make helm-assert-profiles

      - name: Lint
        run: bun run lint:ci

      - name: Dependency policy
        run: |
          bun run deps:check
          bun run deps:dedupe:check

      - name: Knip
        run: bun run knip

      - name: Package boundaries
        run: bun run boundaries

      - name: Test with coverage
        run: bun run test:coverage

      - name: Audit
        run: bun run audit

      - name: Generate production dependency license inventory
        run: bun pm licenses --prod --json > production-licenses.json

      - name: Typecheck and build
        run: bun run ci:types-build

      - name: Generate Turbo task graph
        if: always()
        run: bun run turbo:graph

      - name: Render Turbo report
        if: always()
        run: bun run turbo:report

      - name: Upload Turbo diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-diagnostics
          path: |
            .turbo/runs/*.json
            docs/task-graph.mermaid
            docs/turbo-report.md
            production-licenses.json
          if-no-files-found: warn
          retention-days: 14

      - name: Configure SonarQube metadata
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            if [ -n "${SONAR_ORGANIZATION}" ]; then
              echo "sonar.organization=${SONAR_ORGANIZATION}"
            fi
          } >> sonar-project.properties

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  docker-images:
    name: Docker ${{ matrix.service.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NEXT_IMAGE_STOREFRONT_ORIGIN: ${{ vars.NEXT_IMAGE_STOREFRONT_ORIGIN }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL }}
      NEXT_PUBLIC_CLIENT_APP_URL: ${{ vars.NEXT_PUBLIC_CLIENT_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${{ vars.NEXT_PUBLIC_ORDER_SERVICE_URL }}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: admin
            dockerfile: docker/Dockerfile.admin
          - name: client
            dockerfile: docker/Dockerfile.client
          - name: product-service
            dockerfile: docker/Dockerfile.product-service
          - name: order-service
            dockerfile: docker/Dockerfile.order-service
          - name: payment-service
            dockerfile: docker/Dockerfile.payment-service

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Compute image prefix
        id: image_prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Validate publish-time public configuration
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          required=(
            NEXT_IMAGE_STOREFRONT_ORIGIN
            NEXT_PUBLIC_ADMIN_APP_URL
            NEXT_PUBLIC_CLIENT_APP_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            NEXT_PUBLIC_ORDER_SERVICE_URL
            NEXT_PUBLIC_PAYMENT_SERVICE_URL
            NEXT_PUBLIC_PRODUCT_SERVICE_URL
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          )
          for variable in "${required[@]}"; do
            test -n "${!variable}" || {
              echo "Missing required repository variable: ${variable}" >&2
              exit 1
            }
          done

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Run Docker build checks
        run: |
          docker buildx build \
            --check \
            --file "${{ matrix.service.dockerfile }}" \
            --build-arg "BUN_DEV_IMAGE=${BUN_DEV_IMAGE}" \
            --build-arg "BUN_RUNTIME_IMAGE=${BUN_RUNTIME_IMAGE}" \
            --build-arg "TURBO_VERSION=${TURBO_VERSION}" \
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}" \
            --build-arg "NEXT_IMAGE_ALLOW_LOCAL_IP=false" \
            --build-arg "NEXT_IMAGE_STOREFRONT_ORIGIN=${NEXT_IMAGE_STOREFRONT_ORIGIN}" \
            --build-arg "NEXT_PUBLIC_ADMIN_APP_URL=${NEXT_PUBLIC_ADMIN_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLIENT_APP_URL=${NEXT_PUBLIC_CLIENT_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" \
            --build-arg "NEXT_PUBLIC_ORDER_SERVICE_URL=${NEXT_PUBLIC_ORDER_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PAYMENT_SERVICE_URL=${NEXT_PUBLIC_PAYMENT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PRODUCT_SERVICE_URL=${NEXT_PUBLIC_PRODUCT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" \
            .

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_IMAGE_ALLOW_LOCAL_IP=false
            NEXT_IMAGE_STOREFRONT_ORIGIN=${{ env.NEXT_IMAGE_STOREFRONT_ORIGIN }}
            NEXT_PUBLIC_ADMIN_APP_URL=${{ env.NEXT_PUBLIC_ADMIN_APP_URL }}
            NEXT_PUBLIC_CLIENT_APP_URL=${{ env.NEXT_PUBLIC_CLIENT_APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_PRODUCT_SERVICE_URL=${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          provenance: mode=max
          sbom: true
