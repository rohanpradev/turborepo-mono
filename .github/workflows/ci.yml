name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish configured images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: 4.3.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  K8S_SUPPORTED_VERSIONS: 1.35.9 1.36.5
  K8S_EXPERIMENTAL_VERSIONS: 1.37.1
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock', 'bunfig.toml', '.npmrc', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.setup-bun.outputs.bun-version }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-cache-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-turbo-cache-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('.node-version') }}-

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/admin/.next/cache
            apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/admin/**', 'apps/client/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Cache Knip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/knip
          key: ${{ runner.os }}-knip-${{ hashFiles('bun.lock', 'knip.ts') }}
          restore-keys: |
            ${{ runner.os }}-knip-

      - name: Install dependencies
        run: bun ci

      - name: Validate Prisma 8 contract and migration graph
        run: bun run db:validate

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file .env.example config > /tmp/compose.rendered.yml
          docker compose -f packages/kafka/compose.yml config > /tmp/kafka.compose.rendered.yml
          docker compose -f compose.integration.yml config > /tmp/integration.compose.rendered.yml

      - name: Validate Helm profiles across the Kubernetes matrix
        run: |
          make helm-validate-supported
          make helm-validate-experimental
          make helm-assert-profiles

      - name: Lint
        run: bun run lint:ci

      - name: Dependency policy
        run: |
          bun run deps:check
          bun run deps:dedupe:check

      - name: Knip
        run: bun run knip

      - name: Package boundaries
        run: bun run boundaries

      - name: Test with coverage
        run: bun run test:coverage

      - name: Audit
        run: bun run audit

      - name: Generate production dependency license inventory
        run: bun pm licenses --prod --json > production-licenses.json

      - name: Typecheck and build
        run: bun run ci:types-build

      - name: Smoke test standalone web apps and static assets
        run: bun run test:web

      - name: Generate Turbo task graph
        if: always()
        run: bun run turbo:graph

      - name: Render Turbo report
        if: always()
        run: bun run turbo:report

      - name: Upload Turbo diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-diagnostics
          path: |
            .turbo/runs/*.json
            docs/task-graph.mermaid
            docs/turbo-report.md
            production-licenses.json
          if-no-files-found: warn
          retention-days: 14

      - name: Configure SonarQube metadata
        id: configure-sonar
        if: env.SONAR_PROJECT_KEY != ''
        env:
          SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
        run: |
          if [ "$SONAR_TOKEN_CONFIGURED" != 'true' ]; then
            exit 0
          fi
          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            if [ -n "${SONAR_ORGANIZATION}" ]; then
              echo "sonar.organization=${SONAR_ORGANIZATION}"
            fi
          } >> sonar-project.properties
          echo 'enabled=true' >> "$GITHUB_OUTPUT"

      - name: SonarQube Scan
        if: steps.configure-sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  database-integration:
    name: Database integration
    timeout-minutes: 15
    # MongoDB 8.3.16+ includes the Ubuntu kernel fix (SERVER-131779).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongodb/mongodb-community-server:8.3.17-ubuntu2204-slim-20261111T065308Z@sha256:66a8943ca696bc5a5adc4e04014814bb0bc6fd412222fda85caadcaf08c1d56c
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      kafka:
        image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
        env:
          CLUSTER_ID: gNtGMiY7RJqk7wdUNktAvg
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      INTEGRATION_KAFKA_BROKERS: 127.0.0.1:9092
      INTEGRATION_DATABASE_URL: postgresql://postgres:integration-only-password@127.0.0.1:5432/ecommerce_test
      INTEGRATION_MONGO_URL: mongodb://127.0.0.1:27017/ecommerce_test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: bun ci
      - name: Verify database guarantees
        run: bun run test:integration

  docker-images:
    name: Verify Docker images
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && !(
        (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')))
        || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
      )
    needs: [validate, database-integration]
    permissions:
      contents: read
    uses: ./.github/workflows/docker-images.yml

  publish-images:
    name: Publish Docker images
    if: >-
      (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.publish_images)
    needs: [validate, database-integration]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-images.yml
    with:
      publish: true
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
