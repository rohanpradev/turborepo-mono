name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish configured images to GHCR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4
  BUN_DEV_IMAGE: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
  BUN_RUNTIME_IMAGE: oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
  BUILDX_VERSION: v0.38.1
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  HELM_VERSION: 4.3.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  K8S_SUPPORTED_VERSIONS: 1.35.9 1.36.5
  K8S_EXPERIMENTAL_VERSIONS: 1.37.1
  NODE_VERSION: 24.22.1
  REGISTRY: ghcr.io
  TURBO_VERSION: 2.11.10
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'bunfig.toml', '.npmrc', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/admin/.next/cache
            apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/admin/**', 'apps/client/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Cache Knip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/knip
          key: ${{ runner.os }}-knip-${{ hashFiles('bun.lock', 'knip.ts') }}
          restore-keys: |
            ${{ runner.os }}-knip-

      - name: Install dependencies
        run: bun ci

      - name: Validate Prisma 8 contract and migration graph
        run: bun run db:validate

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file .env.example config > /tmp/compose.rendered.yml
          docker compose -f packages/kafka/compose.yml config > /tmp/kafka.compose.rendered.yml
          docker compose -f compose.integration.yml config > /tmp/integration.compose.rendered.yml

      - name: Validate Helm profiles across the Kubernetes matrix
        run: |
          make helm-validate-supported
          make helm-validate-experimental
          make helm-assert-profiles

      - name: Lint
        run: bun run lint:ci

      - name: Dependency policy
        run: |
          bun run deps:check
          bun run deps:dedupe:check

      - name: Knip
        run: bun run knip

      - name: Package boundaries
        run: bun run boundaries

      - name: Test with coverage
        run: bun run test:coverage

      - name: Audit
        run: bun run audit

      - name: Generate production dependency license inventory
        run: bun pm licenses --prod --json > production-licenses.json

      - name: Typecheck and build
        run: bun run ci:types-build

      - name: Smoke test standalone web apps and static assets
        run: bun run test:web

      - name: Generate Turbo task graph
        if: always()
        run: bun run turbo:graph

      - name: Render Turbo report
        if: always()
        run: bun run turbo:report

      - name: Upload Turbo diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: turbo-diagnostics
          path: |
            .turbo/runs/*.json
            docs/task-graph.mermaid
            docs/turbo-report.md
            production-licenses.json
          if-no-files-found: warn
          retention-days: 14

      - name: Configure SonarQube metadata
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            if [ -n "${SONAR_ORGANIZATION}" ]; then
              echo "sonar.organization=${SONAR_ORGANIZATION}"
            fi
          } >> sonar-project.properties

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  database-integration:
    name: Database integration
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: integration-only-password
          POSTGRES_DB: ecommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mongodb:
        image: mongo:8.3.13@sha256:e16e606f792ea89d2b4907b54e5e31eb86a7a23e27231dce3a982cc8f2d73cd2
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s --health-timeout 10s --health-retries 12
    env:
      INTEGRATION_KAFKA_BROKERS: 127.0.0.1:9092
      INTEGRATION_DATABASE_URL: postgresql://postgres:integration-only-password@127.0.0.1:5432/ecommerce_test
      INTEGRATION_MONGO_URL: mongodb://127.0.0.1:27017/ecommerce_test
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: bun ci
      - name: Verify database guarantees
        run: bun run test:integration

  docker-images:
    name: Docker ${{ matrix.service.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [validate, database-integration]
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Development branches and PRs always build; publishing is for releases.
      PUBLISH_IMAGES: ${{ (github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && inputs.publish_images) }}
      # Published images use the public storefront unless a deployment-specific
      # image-optimizer origin is configured explicitly.
      NEXT_PUBLIC_IMAGE_REMOTE_HOSTS: ${{ vars.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
      NEXT_IMAGE_STOREFRONT_ORIGIN: ${{ vars.NEXT_IMAGE_STOREFRONT_ORIGIN || vars.NEXT_PUBLIC_CLIENT_APP_URL }}
      NEXT_PUBLIC_ADMIN_APP_URL: ${{ vars.NEXT_PUBLIC_ADMIN_APP_URL }}
      NEXT_PUBLIC_CLIENT_APP_URL: ${{ vars.NEXT_PUBLIC_CLIENT_APP_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_ORDER_SERVICE_URL: ${{ vars.NEXT_PUBLIC_ORDER_SERVICE_URL }}
      NEXT_PUBLIC_PAYMENT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
      NEXT_PUBLIC_PRODUCT_SERVICE_URL: ${{ vars.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: admin
            dockerfile: docker/Dockerfile.admin
          - name: client
            dockerfile: docker/Dockerfile.client
          - name: product-service
            dockerfile: docker/Dockerfile.product-service
          - name: order-service
            dockerfile: docker/Dockerfile.order-service
          - name: payment-service
            dockerfile: docker/Dockerfile.payment-service

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Compute image prefix
        id: image_prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Validate publish-time public configuration
        if: env.PUBLISH_IMAGES == 'true' && (matrix.service.name == 'client' || matrix.service.name == 'admin')
        shell: bash
        run: |
          required=(
            NEXT_PUBLIC_ADMIN_APP_URL
            NEXT_PUBLIC_CLIENT_APP_URL
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
            NEXT_PUBLIC_ORDER_SERVICE_URL
            NEXT_PUBLIC_PAYMENT_SERVICE_URL
            NEXT_PUBLIC_PRODUCT_SERVICE_URL
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
          )
          for variable in "${required[@]}"; do
            test -n "${!variable}" || {
              echo "Missing required repository variable: ${variable}" >&2
              exit 1
            }
          done

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Run Docker build checks
        run: |
          docker buildx build \
            --check \
            --file "${{ matrix.service.dockerfile }}" \
            --build-arg "BUN_DEV_IMAGE=${BUN_DEV_IMAGE}" \
            --build-arg "BUN_RUNTIME_IMAGE=${BUN_RUNTIME_IMAGE}" \
            --build-arg "TURBO_VERSION=${TURBO_VERSION}" \
            --build-arg "NEXT_DEPLOYMENT_ID=${GITHUB_SHA}" \
            --build-arg "NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${NEXT_PUBLIC_IMAGE_REMOTE_HOSTS}" \
            --build-arg "NEXT_IMAGE_ALLOW_LOCAL_IP=false" \
            --build-arg "NEXT_IMAGE_STOREFRONT_ORIGIN=${NEXT_IMAGE_STOREFRONT_ORIGIN}" \
            --build-arg "NEXT_PUBLIC_ADMIN_APP_URL=${NEXT_PUBLIC_ADMIN_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLIENT_APP_URL=${NEXT_PUBLIC_CLIENT_APP_URL}" \
            --build-arg "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}" \
            --build-arg "NEXT_PUBLIC_ORDER_SERVICE_URL=${NEXT_PUBLIC_ORDER_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PAYMENT_SERVICE_URL=${NEXT_PUBLIC_PAYMENT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_PRODUCT_SERVICE_URL=${NEXT_PUBLIC_PRODUCT_SERVICE_URL}" \
            --build-arg "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}" \
            .

      - name: Build image for runtime verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          load: true
          push: false
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ env.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_IMAGE_ALLOW_LOCAL_IP=false
            NEXT_IMAGE_STOREFRONT_ORIGIN=${{ env.NEXT_IMAGE_STOREFRONT_ORIGIN }}
            NEXT_PUBLIC_ADMIN_APP_URL=${{ env.NEXT_PUBLIC_ADMIN_APP_URL }}
            NEXT_PUBLIC_CLIENT_APP_URL=${{ env.NEXT_PUBLIC_CLIENT_APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_PRODUCT_SERVICE_URL=${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ecommerce-ci/${{ matrix.service.name }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: linux/amd64
          # The local Docker exporter cannot retain attestations; publish them below.
          provenance: false
          sbom: false

      - name: Test restricted production image before publishing
        run: bash docker/test-image.sh "${{ matrix.service.name }}" "ecommerce-ci/${{ matrix.service.name }}:${{ github.sha }}"

      - name: Publish verified multi-platform image
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          push: true
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
            NEXT_PUBLIC_IMAGE_REMOTE_HOSTS=${{ env.NEXT_PUBLIC_IMAGE_REMOTE_HOSTS }}
            NEXT_IMAGE_ALLOW_LOCAL_IP=false
            NEXT_IMAGE_STOREFRONT_ORIGIN=${{ env.NEXT_IMAGE_STOREFRONT_ORIGIN }}
            NEXT_PUBLIC_ADMIN_APP_URL=${{ env.NEXT_PUBLIC_ADMIN_APP_URL }}
            NEXT_PUBLIC_CLIENT_APP_URL=${{ env.NEXT_PUBLIC_CLIENT_APP_URL }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_ORDER_SERVICE_URL=${{ env.NEXT_PUBLIC_ORDER_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ env.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_PRODUCT_SERVICE_URL=${{ env.NEXT_PUBLIC_PRODUCT_SERVICE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
