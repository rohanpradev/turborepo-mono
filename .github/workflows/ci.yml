name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  BUN_DEV_IMAGE: dhi.io/bun:1.3.14-debian13-dev@sha256:294098cbf9ef24c7c66cb5849ea0c998fef17245d9aa3d955c078a73ccbada89
  BUN_RUNTIME_IMAGE: dhi.io/bun:1.3.14-debian13@sha256:fb5dda72d73bd1e581d014e6546352766f8565bb78ce66a290e4f11fdc188c11
  BUILDX_VERSION: v0.35.0
  HELM_VERSION: 4.2.3
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  K8S_SUPPORTED_VERSIONS: 1.34.9 1.35.6 1.36.2
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  TURBO_VERSION: 2.10.5
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  validate:
    name: Quality
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js environment
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v${{ env.HELM_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Turborepo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Cache Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/admin/.next/cache
            apps/client/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/admin/**', 'apps/client/**', 'packages/**', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Cache Knip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/knip
          key: ${{ runner.os }}-knip-${{ hashFiles('bun.lock', 'knip.json') }}
          restore-keys: |
            ${{ runner.os }}-knip-

      - name: Install dependencies
        run: bun ci

      - name: Validate Docker Compose files
        run: |
          docker compose --env-file .env.example config > /tmp/compose.rendered.yml
          docker compose -f packages/kafka/compose.yml config > /tmp/kafka.compose.rendered.yml

      - name: Validate Helm chart against supported Kubernetes releases
        run: |
          make helm-validate-supported
          for kubernetes_version in ${K8S_SUPPORTED_VERSIONS}; do
            helm template ecommerce charts/ecommerce \
              --namespace ecommerce \
              --kube-version "${kubernetes_version}" \
              --set gateway.enabled=true \
              --set ingress.enabled=false \
              > "/tmp/ecommerce-kubernetes-${kubernetes_version}.yaml"
          done
          if rg -n 'image:.*:latest([@"[:space:]]|$)' /tmp/ecommerce-kubernetes-*.yaml; then
            echo "Rendered Helm manifests must not contain latest image tags." >&2
            exit 1
          fi

      - name: Lint
        run: bun run lint:ci

      - name: Dependency policy
        run: bun run deps:check

      - name: Knip
        run: bun run knip

      - name: Package boundaries
        run: bun run boundaries

      - name: Test with coverage
        run: bun run test:coverage

      - name: Audit
        run: bun run audit

      - name: Typecheck and build
        run: bun run ci:types-build

      - name: Generate Turbo task graph
        if: always()
        run: bun run turbo:graph

      - name: Render Turbo report
        if: always()
        run: bun run turbo:report

      - name: Upload Turbo diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-diagnostics
          path: |
            .turbo/runs/*.json
            docs/task-graph.mermaid
            docs/turbo-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Configure SonarQube metadata
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        run: |
          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            if [ -n "${SONAR_ORGANIZATION}" ]; then
              echo "sonar.organization=${SONAR_ORGANIZATION}"
            fi
          } >> sonar-project.properties

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

  docker-images:
    name: Docker ${{ matrix.service.name }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: admin
            dockerfile: docker/Dockerfile.admin
          - name: client
            dockerfile: docker/Dockerfile.client
          - name: product-service
            dockerfile: docker/Dockerfile.product-service
          - name: order-service
            dockerfile: docker/Dockerfile.order-service
          - name: payment-service
            dockerfile: docker/Dockerfile.payment-service

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Validate Docker Hardened Images credentials
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKER_USERNAME" || {
            echo "Missing DOCKER_USERNAME secret for dhi.io image pulls." >&2
            exit 1
          }
          test -n "$DOCKER_PASSWORD" || {
            echo "Missing DOCKER_PASSWORD secret for dhi.io image pulls." >&2
            exit 1
          }

      - name: Compute image prefix
        id: image_prefix
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hardened Images
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUN_DEV_IMAGE=${{ env.BUN_DEV_IMAGE }}
            BUN_RUNTIME_IMAGE=${{ env.BUN_RUNTIME_IMAGE }}
            TURBO_VERSION=${{ env.TURBO_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }},ignore-error=true
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          provenance: mode=max
          sbom: true
